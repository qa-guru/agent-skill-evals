name: ai-pipeline

# Runs on every push to main (post-merge signal, deliberate spend: evals make
# PAID model calls and are nondeterministic, so they still do not gate PRs)
# and manually via workflow_dispatch. To run on a schedule, uncomment the
# block below — it is off by default on purpose.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '23 4 * * *'   # nightly, UTC

# Serialize runs per ref: a burst of merges queues instead of running paid
# evals in parallel; every run is kept (evidence is never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVAL_AGENT: codex

jobs:
  evals:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # tools/versions.sh requires Gradle exactly 9.6.0 on PATH and the repo has
      # no wrapper (tools/*.sh call `gradle` directly), so the pinned
      # distribution is installed and checksum-verified instead of generating
      # a wrapper.
      - name: Install Gradle 9.6.0
        run: |
          curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
            https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
          echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
          unzip -q "$RUNNER_TEMP/gradle.zip" -d "$RUNNER_TEMP"
          echo "$RUNNER_TEMP/gradle-9.6.0/bin" >> "$GITHUB_PATH"

      # Both caches are shared writable state the eval run depends on:
      # ~/.gradle because tools/*.sh resolve dependencies with
      # `gradle --offline`, ~/.cache/selenium because the eval forces
      # SE_OFFLINE=true (see the warmup step below).
      - name: Restore Gradle + Selenium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/.cache/selenium
          key: ${{ runner.os }}-evals-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-evals-

      - name: Python 3 (evidence adapter requires 3.9+)
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Install Codex CLI
        run: |
          npm install --global @openai/codex@0.167.0
          codex --version

      - name: CLI preflight (java/javac 21, gradle 9.6.0, git)
        run: sh tools/versions.sh

      # A cold ~/.gradle cannot resolve dependencies for `gradle --offline`,
      # so they are fetched online exactly once before any wrapper runs.
      - name: Resolve Gradle dependencies (online)
        run: gradle testClasses

      - name: Offline compile check
        run: sh tools/compile-tests.sh

      # REQUIRED warmup, not optional: tools/evals.sh runs the agent and the
      # independent verification build with SE_OFFLINE=true, so Selenium
      # Manager cannot download anything during the eval — ~/.cache/selenium
      # must already hold a driver matching the runner's Chrome. This is the
      # only step allowed to perform a real browser run for cache warming; the
      # SUT is the repo-local login.html (file://), no external service.
      - name: Warm Selenium driver cache (authorized browser run)
        run: sh tools/run-tests.sh --allow-sut one login-success

      - name: Free checks — evidence parser unit tests
        run: python3 -B -m unittest discover -s evals -p 'test_*.py'

      - name: Free checks — eval case listing
        run: sh tools/evals.sh list

      - name: Codex login (repo secret required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          elif [ -n "${CODEX_ACCESS_TOKEN:-}" ]; then
            printenv CODEX_ACCESS_TOKEN | codex login --with-access-token
          else
            echo "::error::No Codex credential. Add repository secret OPENAI_API_KEY (or CODEX_ACCESS_TOKEN) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          codex login status

      - name: Run eval cases (paid model calls)
        run: sh tools/evals.sh --allow-agent all

      # Opt-in paid pass: LLM_JUDGE is only honored while a case is executing,
      # so a judged evaluation re-runs the agent for every case — that is a
      # second full set of agent calls plus one judge call per case. Enable by
      # setting the repository VARIABLE LLM_JUDGE=1 (Settings > Secrets and
      # variables > Actions > Variables). Kept as a separate gated step so the
      # default manual run stays cheaper and deterministic-only.
      - name: LLM-judged eval pass (opt-in via vars.LLM_JUDGE=1)
        if: vars.LLM_JUDGE == '1'
        env:
          LLM_JUDGE: '1'
        run: sh tools/evals.sh --allow-agent all

      # Run transcripts are evidence: upload on every outcome, never clean.
      - name: Upload eval evidence (evals/runs/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-runs-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/runs/
          if-no-files-found: warn
          retention-days: 30
