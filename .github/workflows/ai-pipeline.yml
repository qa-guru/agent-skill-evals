name: ai-pipeline

# Self-healing login-test pipeline in three stages.
#   test   — the real browser login test; a red run is data, not a run
#            failure (green run = healed), so it reports via an output.
#   heal   — only on red: the LLM agent loop works the fix-failing-test
#            skill inside the repo harness and hands the healed
#            LoginTest.java downstream as an artifact.
#   verify — on a fresh runner: apply the artifact, gradle cleanTest test
#            is the only authority; never the agent's word. On verified
#            green the same job bot-commits the file to main with
#            [skip ci]. Still red after heal = real SUT breakage.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs per ref: a burst of merges queues instead of overlapping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    name: test
    runs-on: ubuntu-latest
    outputs:
      failed: ${{ steps.first.outputs.failed }}
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test environment (caches, Gradle, headless)
        uses: ./.github/actions/test-env

      - name: CLI preflight (java/javac 21, gradle 9.6.0, git)
        run: sh tools/versions.sh

      # Green ends the pipeline here — zero paid calls. Red is captured in
      # an output (NEVER continue-on-error / a hard-failing job: either
      # would poison the final run conclusion even after a successful heal)
      # and the log becomes the agent's evidence downstream.
      # shell: bash is required — the default `bash -e` lacks pipefail and
      # tee would swallow gradle's exit code.
      - name: Browser login test — first pass
        id: first
        shell: bash
        run: |
          mkdir -p build/heal
          if gradle test --tests 'tests.LoginTest.successfulLoginTest' 2>&1 | tee build/heal/first-pass.log; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
            echo "login test failed — heal stage armed"
          fi

      - name: Share failure log with the heal stage
        if: steps.first.outputs.failed == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: first-pass-log
          path: build/heal/first-pass.log
          retention-days: 1

  heal:
    name: heal
    needs: test
    if: needs.test.outputs.failed == 'true'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      # The agent self-verifies inside its loop, so it needs the same
      # browser-test environment as the test stage.
      - name: Test environment (caches, Gradle, headless)
        uses: ./.github/actions/test-env

      - name: Download failure log
        uses: actions/download-artifact@v8
        with:
          name: first-pass-log
          path: build/heal

      - name: Agent heals the test (paid)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/heal-agent.py build/heal/first-pass.log

      - name: Guard — only LoginTest.java, must differ
        run: |
          touched=$(git status --porcelain | awk '{print $2}' | grep -vx 'src/test/java/tests/LoginTest.java' || true)
          if [ -n "$touched" ]; then
            echo "::error::agent touched files outside LoginTest.java: $touched"
            exit 1
          fi
          if git diff --quiet -- src/test/java/tests/LoginTest.java; then
            echo "::error::agent produced no change to LoginTest.java"
            exit 1
          fi
          git diff -- src/test/java/tests/LoginTest.java

      - name: Hand the healed test to verify
        run: |
          mkdir -p build/healed
          cp src/test/java/tests/LoginTest.java build/healed/

      - name: Upload healed test
        uses: actions/upload-artifact@v7
        with:
          name: healed-test
          path: build/healed/
          retention-days: 1

  verify:
    name: verify + commit
    needs: heal
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the verified test back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'

      - name: Test environment (caches, Gradle, headless)
        uses: ./.github/actions/test-env

      - name: Download healed test
        uses: actions/download-artifact@v8
        with:
          name: healed-test
          path: build/healed

      - name: Apply healed test
        run: cp build/healed/LoginTest.java src/test/java/tests/LoginTest.java

      # cleanTest forces re-execution: the agent already ran the test inside
      # its loop, and up-to-date results would skip execution entirely.
      - name: Browser login test — independent verification
        shell: bash  # pipefail: a red rerun must fail the job, not tee's 0
        run: |
          mkdir -p build/heal
          gradle cleanTest test --tests 'tests.LoginTest.successfulLoginTest' 2>&1 | tee build/heal/verify.log

      - name: Upload verify log on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: verify-log
          path: build/heal/verify.log
          retention-days: 7

      # The applied file is already verified green by the step above —
      # commit it without a third paid pipeline pass ([skip ci]).
      - name: Commit verified test to main
        run: |
          git diff -- src/test/java/tests/LoginTest.java
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/java/tests/LoginTest.java
          git commit -m "Heal login test with agent [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main
