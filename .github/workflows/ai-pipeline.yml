name: ai-pipeline

# Self-healing login-test pipeline driven by an agent healer. On every push
# to main the real browser login test runs first — a green run ends there
# with zero paid calls. A red run invokes the Codex agent: it reads the SUT
# contract (login.html) plus the failure log and minimally rewrites ONLY
# LoginTest.java. The same browser test is then re-run as the authority —
# the agent's own word never counts. A healed file is committed back as
# github-actions[bot] with [skip ci]. If no honest test can pass because
# the SUT itself is broken, the run stays red — green is never faked.
on:
  push:
    branches: [main]
  workflow_dispatch:

# Serialize runs per ref: a burst of merges queues instead of overlapping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: heal + verify
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the healed test back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ~/.gradle/dist holds the pinned Gradle install, ~/.cache/selenium the
      # browser/driver pair, ~/.cache/codex the pinned agent CLI. One restore
      # covers all three — cold caches download once, warm runs install none.
      - name: Restore caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/.cache/selenium
            ~/.cache/codex
          key: ${{ runner.os }}-verify-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-verify-

      # tools/versions.sh requires Gradle exactly 9.6.0 on PATH and the repo
      # has no wrapper (tools/*.sh call `gradle` directly).
      - name: Install Gradle 9.6.0
        run: |
          dist="$HOME/.gradle/dist/gradle-9.6.0"
          if [ ! -x "$dist/bin/gradle" ]; then
            curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
              https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
            echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
            mkdir -p "$HOME/.gradle/dist"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME/.gradle/dist"
          fi
          echo "$dist/bin" >> "$GITHUB_PATH"

      # CI runners have no display, and a -D flag on the gradle CLI does not
      # reach forked test JVMs — the init script is the one channel that
      # reaches every test JVM on this runner (including inside codex exec).
      - name: Force headless browser for all Gradle test runs
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/selenide-headless.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  systemProperty 'selenide.headless', 'true'
              }
          }
          EOF

      - name: CLI preflight (java/javac 21, gradle 9.6.0, git)
        run: sh tools/versions.sh

      # First pass — free, and on a cold cache it also warms the Gradle
      # classpath and Selenium caches. Green ends the run here; red arms the
      # paid heal path below and the log becomes the agent's evidence. The
      # exit code is captured into an output — NEVER continue-on-error:
      # that flag would mark the step successful while the test is red.
      - name: Login test — first pass
        id: first
        run: |
          mkdir -p build/heal
          if gradle test --tests 'tests.LoginTest.successfulLoginTest' 2>&1 | tee build/heal/first-pass.log; then
            echo "failed=false" >> "$GITHUB_OUTPUT"
          else
            echo "failed=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Install Codex CLI (heal path only)
        if: steps.first.outputs.failed == 'true'
        run: |
          if ! "$HOME/.cache/codex/bin/codex" --version 2>/dev/null | grep -q '0\.167\.0'; then
            npm install --global --prefix "$HOME/.cache/codex" \
              --no-fund --no-audit --loglevel=error @openai/codex@0.167.0
          fi
          echo "$HOME/.cache/codex/bin" >> "$GITHUB_PATH"

      - name: Codex login (repo secret required)
        if: steps.first.outputs.failed == 'true'
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          elif [ -n "${CODEX_ACCESS_TOKEN:-}" ]; then
            printenv CODEX_ACCESS_TOKEN | codex login --with-access-token
          else
            echo "::error::No Codex credential. Add repository secret OPENAI_API_KEY (or CODEX_ACCESS_TOKEN) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      # The agent is the healer — it reasons over the live SUT contract, so
      # arbitrary SUT changes (renamed selectors, restructured JS, new
      # credentials, new copy) are in scope, not a fixed list of patterns.
      # Guards after the call: only LoginTest.java may be touched, and the
      # independent rerun — not the agent's report — decides green.
      - name: Agent heals the test
        if: steps.first.outputs.failed == 'true'
        run: |
          codex exec --ephemeral --skip-git-repo-check \
            --sandbox workspace-write -C "$GITHUB_WORKSPACE" \
            --add-dir "$HOME/.gradle" --add-dir "$HOME/.cache/selenium" \
            -c 'sandbox_workspace_write.network_access=true' \
            -o build/heal/last-message.txt "$(cat <<'PROMPT'
          The browser test tests.LoginTest.successfulLoginTest just failed;
          its output is at build/heal/first-pass.log.

          login.html is the system under test and the contract — NEVER edit
          it. Never edit anything outside src/test/java/tests/LoginTest.java.

          Read login.html, the test and the failure log. Determine which
          contract points the test is stale on — element selectors
          (data-testid), credentials, expected message — and update ONLY
          LoginTest.java with minimal edits so it matches what the SUT
          actually provides and renders. Do not weaken the scenario: it must
          still fill the login form, submit it and assert the success banner.

          Then verify yourself:
          gradle test --tests 'tests.LoginTest.successfulLoginTest'

          If no honest test can pass because the SUT itself is broken, do not
          hack the test — report UNHEALABLE with the reason instead.

          Final answer must start with HEALED or UNHEALABLE, then one
          sentence of evidence.
          PROMPT
          )"

      - name: Guard + independent verification + commit healed test
        if: steps.first.outputs.failed == 'true'
        run: |
          touched=$(git status --porcelain | awk '{print $2}' | grep -vx 'src/test/java/tests/LoginTest.java' || true)
          if [ -n "$touched" ]; then
            echo "::error::agent touched files outside LoginTest.java: $touched"
            exit 1
          fi
          # The rerun is the only authority — never the agent's report.
          gradle test --tests 'tests.LoginTest.successfulLoginTest' 2>&1 | tee build/heal/verify-pass.log
          if git diff --quiet -- src/test/java/tests/LoginTest.java; then
            echo "test green; nothing to commit"
            exit 0
          fi
          git diff -- src/test/java/tests/LoginTest.java
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/java/tests/LoginTest.java
          git commit -m "Heal login test with agent [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      - name: Upload heal evidence on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: heal-evidence
          path: build/heal/
          retention-days: 7
