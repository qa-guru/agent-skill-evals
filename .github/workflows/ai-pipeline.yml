name: ai-pipeline

# Runs on every push to main (post-merge signal, deliberate spend: evals make
# PAID model calls and are nondeterministic, so they still do not gate PRs)
# and manually via workflow_dispatch. To run on a schedule, uncomment the
# block below — it is off by default on purpose.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '23 4 * * *'   # nightly, UTC

# Serialize runs per ref: a burst of merges queues instead of running paid
# evals in parallel; every run is kept (evidence is never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVAL_AGENT: codex

# Two stages on the free/paid boundary:
# - verify warms the shared caches and runs every free check fully offline;
# - evals logs Codex in once, runs the run-tests cases, then the
#   fix-failing-test case (agent fix + independent browser verification),
#   and commits the verified fix back to main. LLM_JUDGE=1 (repo variable)
#   adds a judged re-run of every case — a second full paid pass, opt-in.
# A failed step stops the stage so broken builds never burn eval tokens.
# Exception: a FAILED login TEST warns and continues — SUT/test mismatch is
# a valid signal this pipeline exists to measure; only a run that never
# executes (no JUnit XML) is an infra failure worth stopping for.
# Toolchain setup is identical in both stages via .github/actions/eval-env.
jobs:
  verify:
    name: verify (free)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain + caches
        uses: ./.github/actions/eval-env
        with:
          save-cache: 'true'

      - name: CLI preflight (java/javac 21, gradle 9.6.0, git)
        run: sh tools/versions.sh

      # One online browser run warms BOTH caches at once:
      # - ~/.gradle gets the full test RUNTIME classpath — `gradle testClasses`
      #   alone only resolves the compile classpath, and tools/*.sh then run
      #   `gradle --offline`, which fails on any missing runtime jar;
      # - ~/.cache/selenium gets the matching Chrome driver — REQUIRED because
      #   tools/evals.sh runs the agent and the independent verification build
      #   with SE_OFFLINE=true, so Selenium Manager cannot download anything
      #   during the eval.
      # The SUT is the repo-local login.html (file://) — no external service.
      # A failed TEST warns and continues (both caches are still warm); only
      # a run that never executes — no JUnit XML — is an infra failure.
      - name: Warm caches — authorized login-success browser run
        run: |
          if gradle test --tests 'tests.LoginTest.successfulLoginTest'; then
            echo "login-success: PASS"
          elif [ -f build/test-results/test/TEST-tests.LoginTest.xml ]; then
            echo "::warning::login-success FAILED — SUT/test mismatch is a valid signal; caches are warm, the pipeline continues"
          else
            echo "::error::login-success did not execute — no JUnit XML (infra/env failure)"
            exit 1
          fi

      - name: Offline compile check
        run: sh tools/compile-tests.sh

      # Same contract as the warmup: a failed test warns and the chain
      # continues; a run that never executes is an infra failure.
      - name: Offline wrapper check — login-success
        run: |
          if sh tools/run-tests.sh --allow-sut one login-success; then
            echo "wrapper login-success: PASS"
          elif [ -f build/test-results/test/TEST-tests.LoginTest.xml ]; then
            echo "::warning::login-success FAILED — SUT/test mismatch is a valid signal; evals stage still runs"
          else
            echo "::error::login-success did not execute — no JUnit XML (infra/env failure)"
            exit 1
          fi

      - name: Evidence parser unit tests
        run: python3 -B -m unittest discover -s evals -p 'test_*.py'

      - name: Eval case listing
        run: sh tools/evals.sh list

  evals:
    name: evals (paid)
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the eval-verified test fix back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain + caches + Codex CLI
        uses: ./.github/actions/eval-env
        with:
          save-cache: 'false'
          codex: 'true'

      - name: Codex login (repo secret required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          elif [ -n "${CODEX_ACCESS_TOKEN:-}" ]; then
            printenv CODEX_ACCESS_TOKEN | codex login --with-access-token
          else
            echo "::error::No Codex credential. Add repository secret OPENAI_API_KEY (or CODEX_ACCESS_TOKEN) under Settings > Secrets and variables > Actions."
            exit 1
          fi

      - name: Run run-tests cases (paid model calls)
        run: sh tools/evals.sh --allow-agent group run-tests

      - name: Run fix-failing-test cases (paid model calls)
        run: sh tools/evals.sh --allow-agent group fix-failing-test

      # Close the loop: on a green case, evals.sh preserved the agent's
      # verified file as evals/runs/<case>/fixed-test — the file check_source
      # proved is "committed source + SUT literal only" and the independent
      # JUnit run proved passes against the real SUT. Commit it back so the
      # repo test actually tracks the contract. [skip ci]: the file is
      # already verified; a second pipeline run would only re-burn paid
      # evals. No-op when the committed test already matches the SUT.
      - name: Commit the eval-verified test fix back to main
        run: |
          fixed=$(ls -t evals/runs/fix-failing-stale-expectation-*/fixed-test 2>/dev/null | head -1)
          if [ -z "$fixed" ]; then
            echo "no verified fix artifact produced — nothing to commit"
            exit 0
          fi
          cp "$fixed" src/test/java/tests/LoginTest.java
          if git diff --quiet -- src/test/java/tests/LoginTest.java; then
            echo "committed test already matches the SUT — nothing to commit"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/java/tests/LoginTest.java
          git commit -m "Apply eval-verified login test fix [skip ci]" \
                   -m "fix-failing-stale-expectation passed: agent correction verified by the independent offline browser run."
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # Opt-in paid pass: LLM_JUDGE is only honored while a case executes, so
      # a judged evaluation re-runs the agent for every case — a second full
      # set of agent calls plus one judge call per case. Enable by setting
      # the repository VARIABLE LLM_JUDGE=1.
      - name: LLM-judged eval pass (re-runs all cases)
        if: vars.LLM_JUDGE == '1'
        env:
          LLM_JUDGE: '1'
        run: sh tools/evals.sh --allow-agent all

      # Run transcripts are evidence: upload on every outcome, never clean.
      - name: Upload eval evidence (evals/runs/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-runs-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/runs/
          if-no-files-found: warn
          retention-days: 30
