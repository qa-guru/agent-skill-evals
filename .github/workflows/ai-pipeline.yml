name: ai-pipeline

# Runs on every push to main (post-merge signal, deliberate spend: evals make
# PAID model calls and are nondeterministic, so they still do not gate PRs)
# and manually via workflow_dispatch. To run on a schedule, uncomment the
# block below — it is off by default on purpose.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '23 4 * * *'   # nightly, UTC

# Serialize runs per ref: a burst of merges queues instead of running paid
# evals in parallel; every run is kept (evidence is never cancelled).
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

env:
  EVAL_AGENT: codex

# Stage chain: preflight warms the shared caches, tests verifies everything
# free and offline, then each paid eval group is its own explicit stage —
# evals runs the run-tests cases, fix-tests runs the fix-failing-test case
# (agent fix plus an independent browser verification) — and judge (opt-in)
# re-runs every case under an LLM rubric. A failed stage stops the chain so
# broken builds never burn eval tokens; a new eval group needs a new stage.
# Toolchain setup is identical in every stage via .github/actions/eval-env.
jobs:
  preflight:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain + caches
        uses: ./.github/actions/eval-env
        with:
          save-cache: 'true'

      - name: CLI preflight (java/javac 21, gradle 9.6.0, git)
        run: sh tools/versions.sh

      # One online browser run warms BOTH caches at once:
      # - ~/.gradle gets the full test RUNTIME classpath — `gradle testClasses`
      #   alone only resolves the compile classpath, and tools/*.sh then run
      #   `gradle --offline`, which fails on any missing runtime jar;
      # - ~/.cache/selenium gets the matching Chrome driver — REQUIRED because
      #   tools/evals.sh runs the agent and the independent verification build
      #   with SE_OFFLINE=true, so Selenium Manager cannot download anything
      #   during the eval.
      # The SUT is the repo-local login.html (file://) — no external service.
      - name: Warm caches — authorized login-success browser run
        run: gradle test --tests 'tests.LoginTest.successfulLoginTest'

  tests:
    name: tests (free)
    needs: preflight
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain + caches
        uses: ./.github/actions/eval-env
        with:
          save-cache: 'false'

      # Proves the sanctioned wrappers now work fully offline on warm caches.
      - name: Offline compile check
        run: sh tools/compile-tests.sh

      - name: Offline wrapper check — login-success
        run: sh tools/run-tests.sh --allow-sut one login-success

      - name: Evidence parser unit tests
        run: python3 -B -m unittest discover -s evals -p 'test_*.py'

      - name: Eval case listing
        run: sh tools/evals.sh list

  evals:
    name: 'evals: run-tests (paid)'
    needs: tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain + caches + Codex CLI
        uses: ./.github/actions/eval-env
        with:
          save-cache: 'false'
          codex: 'true'

      - name: Codex login (repo secret required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          elif [ -n "${CODEX_ACCESS_TOKEN:-}" ]; then
            printenv CODEX_ACCESS_TOKEN | codex login --with-access-token
          else
            echo "::error::No Codex credential. Add repository secret OPENAI_API_KEY (or CODEX_ACCESS_TOKEN) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          codex login status

      - name: Run run-tests cases (paid model calls)
        run: sh tools/evals.sh --allow-agent group run-tests

      # Run transcripts are evidence: upload on every outcome, never clean.
      - name: Upload eval evidence (evals/runs/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: evals-runs-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/runs/
          if-no-files-found: warn
          retention-days: 30

  # The fix-failing-test group is a separate paid stage so the agent-fix
  # scenario stays explicit in the pipeline graph: the agent repairs a seeded
  # stale expectation, then the harness re-verifies it with an independent
  # offline browser run in a fresh build directory.
  fix-tests:
    name: 'evals: fix-failing-test (paid)'
    needs: evals
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain + caches + Codex CLI
        uses: ./.github/actions/eval-env
        with:
          save-cache: 'false'
          codex: 'true'

      - name: Codex login (repo secret required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          elif [ -n "${CODEX_ACCESS_TOKEN:-}" ]; then
            printenv CODEX_ACCESS_TOKEN | codex login --with-access-token
          else
            echo "::error::No Codex credential. Add repository secret OPENAI_API_KEY (or CODEX_ACCESS_TOKEN) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          codex login status

      - name: Run fix-failing-test cases (paid model calls)
        run: sh tools/evals.sh --allow-agent group fix-failing-test

      # Run transcripts are evidence: upload on every outcome, never clean.
      - name: Upload eval evidence (evals/runs/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: fix-tests-runs-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/runs/
          if-no-files-found: warn
          retention-days: 30

  # Opt-in paid pass: LLM_JUDGE is only honored while a case is executing,
  # so a judged evaluation re-runs the agent for every case — that is a
  # second full set of agent calls plus one judge call per case. Enable by
  # setting the repository VARIABLE LLM_JUDGE=1 (Settings > Secrets and
  # variables > Actions > Variables). Kept as a separate gated stage so the
  # default run stays cheaper and deterministic-only.
  judge:
    name: judge (paid, opt-in)
    needs: fix-tests
    if: vars.LLM_JUDGE == '1'
    runs-on: ubuntu-latest
    env:
      LLM_JUDGE: '1'
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Toolchain + caches + Codex CLI
        uses: ./.github/actions/eval-env
        with:
          save-cache: 'false'
          codex: 'true'

      - name: Codex login (repo secret required)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          CODEX_ACCESS_TOKEN: ${{ secrets.CODEX_ACCESS_TOKEN }}
        run: |
          if [ -n "${OPENAI_API_KEY:-}" ]; then
            printenv OPENAI_API_KEY | codex login --with-api-key
          elif [ -n "${CODEX_ACCESS_TOKEN:-}" ]; then
            printenv CODEX_ACCESS_TOKEN | codex login --with-access-token
          else
            echo "::error::No Codex credential. Add repository secret OPENAI_API_KEY (or CODEX_ACCESS_TOKEN) under Settings > Secrets and variables > Actions."
            exit 1
          fi
          codex login status

      - name: LLM-judged eval pass (re-runs all cases)
        run: sh tools/evals.sh --allow-agent all

      # Run transcripts are evidence: upload on every outcome, never clean.
      - name: Upload judge evidence (evals/runs/)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: judge-runs-run-${{ github.run_id }}-${{ github.run_attempt }}
          path: evals/runs/
          if-no-files-found: warn
          retention-days: 30
