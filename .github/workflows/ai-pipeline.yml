name: ai-pipeline

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    outputs:
      eligible: ${{ steps.login.outputs.eligible }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-env

      - name: Run the login test
        id: login
        run: |
          if gradle test --rerun --tests 'tests.LoginTest.successfulLoginTest'; then
            exit 0
          fi
          python3 tools/heal-agent.py check build/test-results/test/TEST-tests.LoginTest.xml
          echo "::warning::Login test failed; passing the report to the heal job."
          echo "eligible=true" >> "$GITHUB_OUTPUT"

      - name: Upload the failed JUnit report
        if: steps.login.outputs.eligible == 'true'
        uses: actions/upload-artifact@v7
        with:
          name: login-failure
          path: build/test-results/test/TEST-tests.LoginTest.xml
          retention-days: 1

  heal:
    needs: test
    if: needs.test.outputs.eligible == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-env

      - name: Download the failed JUnit report
        uses: actions/download-artifact@v8
        with:
          name: login-failure
          path: build/heal

      - name: Propose a test fix (paid)
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: python3 tools/heal-agent.py propose build/heal/TEST-tests.LoginTest.xml

      - name: Upload the candidate test
        uses: actions/upload-artifact@v7
        with:
          name: login-candidate
          path: src/test/java/tests/LoginTest.java
          if-no-files-found: error
          retention-days: 1

  verify:
    needs: heal
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: ./.github/actions/test-env

      - name: Download the candidate test
        uses: actions/download-artifact@v8
        with:
          name: login-candidate
          path: build/heal

      - name: Apply and verify the candidate
        run: |
          cp build/heal/LoginTest.java src/test/java/tests/LoginTest.java
          git diff --check
          gradle test --rerun --tests 'tests.LoginTest.successfulLoginTest'
          git diff -- src/test/java/tests/LoginTest.java > build/heal/login-test.patch

      - name: Upload the verified patch
        uses: actions/upload-artifact@v7
        with:
          name: verified-login-patch
          path: build/heal/login-test.patch

      - name: Upload verification reports on failure
        if: failure()
        uses: actions/upload-artifact@v7
        with:
          name: login-verification-failure
          path: |
            build/test-results/test/
            build/reports/tests/
          retention-days: 7
