name: ai-pipeline

# Self-healing login-test pipeline. On every push to main it renders the
# expected welcome text from the SUT contract (login.html), syncs the test's
# expected literal to it, commits the change back as github-actions[bot]
# ([skip ci] — the browser run below already verifies the synced file), and
# runs the real login test as the SUT health check. A failed test after the
# sync is real SUT breakage, so it fails the run — no warning path needed.
on:
  push:
    branches: [main]
  workflow_dispatch:
  # schedule:
  #   - cron: '23 4 * * *'   # nightly, UTC

# Serialize runs per ref: a burst of merges queues instead of overlapping.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  verify:
    name: sync + verify
    runs-on: ubuntu-latest
    permissions:
      contents: write  # commits the synced test back to main
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Java 21 (Temurin)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # ~/.gradle is restored before the Gradle install so the pinned
      # distribution under ~/.gradle/dist survives across runs; the 100MB
      # download + checksum verification only happens on a cold cache.
      - name: Restore Gradle + Selenium caches
        uses: actions/cache@v4
        with:
          path: |
            ~/.gradle
            ~/.cache/selenium
          key: ${{ runner.os }}-verify-${{ hashFiles('build.gradle') }}
          restore-keys: |
            ${{ runner.os }}-verify-

      # tools/versions.sh requires Gradle exactly 9.6.0 on PATH and the repo
      # has no wrapper (tools/*.sh call `gradle` directly).
      - name: Install Gradle 9.6.0
        run: |
          dist="$HOME/.gradle/dist/gradle-9.6.0"
          if [ ! -x "$dist/bin/gradle" ]; then
            curl -fsSL -o "$RUNNER_TEMP/gradle.zip" \
              https://services.gradle.org/distributions/gradle-9.6.0-bin.zip
            echo "bbaeb2fef8710818cf0e261201dab964c572f92b942812df0c3620d62a529a01  $RUNNER_TEMP/gradle.zip" | sha256sum -c -
            mkdir -p "$HOME/.gradle/dist"
            unzip -q "$RUNNER_TEMP/gradle.zip" -d "$HOME/.gradle/dist"
          fi
          echo "$dist/bin" >> "$GITHUB_PATH"

      # CI runners have no display, and a -D flag on the gradle CLI does not
      # reach forked test JVMs — the init script is the one channel that
      # reaches every test JVM on this runner.
      - name: Force headless browser for all Gradle test runs
        run: |
          mkdir -p "$HOME/.gradle/init.d"
          cat > "$HOME/.gradle/init.d/selenide-headless.gradle" <<'EOF'
          allprojects {
              tasks.withType(Test).configureEach {
                  systemProperty 'selenide.headless', 'true'
              }
          }
          EOF

      - name: CLI preflight (java/javac 21, gradle 9.6.0, git)
        run: sh tools/versions.sh

      # The expected literal is derived from the SUT (the en welcome template
      # rendered with the login the test uses) and normalized like DOM
      # getText: whitespace collapsed and trimmed.
      - name: Sync test expectation with the SUT contract
        run: |
          tmpl=$(sed -n "s/.*en: *{ *welcome: *'\([^']*\)'.*/\1/p" login.html | head -1)
          login=$(sed -n '/login-input/ s/.*setValue("\([^"]*\)").*/\1/p' src/test/java/tests/LoginTest.java | head -1)
          if [ -z "$tmpl" ] || [ -z "$login" ]; then
            echo "::error::cannot derive expected text from login.html / LoginTest.java"
            exit 1
          fi
          expected=$(printf '%s' "$tmpl" | sed "s/{[A-Za-z_][A-Za-z_]*}/$login/g" | tr -s '[:space:]' ' ' | sed 's/^ //; s/ $//')
          esc=$(printf '%s' "$expected" | sed 's/[\\&/]/\\&/g')
          sed -i "/authorized-banner/ s/text(\"[^\"]*\")/text(\"$esc\")/" src/test/java/tests/LoginTest.java
          if git diff --quiet -- src/test/java/tests/LoginTest.java; then
            echo "test already matches SUT: \"$expected\""
            exit 0
          fi
          echo "synced expectation to: \"$expected\""
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/test/java/tests/LoginTest.java
          git commit -m "Sync login test expectation with SUT [skip ci]"
          git fetch origin main
          git rebase origin/main
          git push origin HEAD:main

      # Online-capable browser run: resolves dependencies on a cold cache and
      # verifies the login flow + the synced assertion against the real SUT.
      - name: Login test (browser verification)
        run: gradle test --tests 'tests.LoginTest.successfulLoginTest'
